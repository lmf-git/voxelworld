<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spherical Voxel World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
        }
        #info {
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.5;
        }
        .control {
            margin: 5px 0;
        }
        button {
            margin: 5px 5px 5px 0;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div><strong>Spherical Voxel World</strong></div>
        <div class="control">
            <button id="addTerrain">Add Terrain</button>
            <button id="removeTerrain">Remove Terrain</button>
            <button id="regenerate">Regenerate</button>
        </div>
        <div id="info">
            <div>Controls:</div>
            <div>WASD - Move | Mouse - Look</div>
            <div>Click - Destroy Terrain</div>
            <div>Shift+Click - Add Terrain</div>
            <div>Space - Up | Ctrl - Down</div>
        </div>
        <div id="stats" style="margin-top: 10px;"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
